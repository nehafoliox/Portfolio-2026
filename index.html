<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neha Patel — Product & UI/UX designer. Web design, UX research, and design engineering." />
    <meta name="theme-color" content="#0c0c0c" />
    <title>Neha Patel — Portfolio</title>

    <!-- Social / Open Graph & Twitter Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Neha Patel — Portfolio" />
    <meta property="og:description" content="Product & UI/UX designer portfolio. Web design, UX research, and design engineering." />
    <meta property="og:image" content="/video-poster.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Neha Patel — Portfolio" />
    <meta name="twitter:description" content="Product & UI/UX designer portfolio. Web design, UX research, and design engineering." />
    <meta name="twitter:image" content="/video-poster.webp" />

    <!-- Poster preloads — conditioned on media query so devices only fetch what they render -->
    <!-- Desktop poster (matches the video frame at center gaze) -->
    <link rel="preload" as="image" href="/video-poster.webp" media="(min-width: 1280px)" fetchpriority="high" />
    <!-- Mobile/Tablet static character model -->
    <link rel="preload" as="image" href="/neha-model.webp" media="(max-width: 1279.5px)" fetchpriority="high" />

    <!-- Fonts: Rachel system — Geist Sans + Geist Mono + Crimson Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background: #0c0c0c">
    <div id="root" style="background: #0c0c0c"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
